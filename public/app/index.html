<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinner Crown · La cena di famiglia</title>
<meta name="description" content="Crea il tuo personaggio, a turno uno fa lo chef, tutti votano in segreto e chi vince porta la corona.">
<meta name="theme-color" content="#FDF2EC">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/bagel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinner Crown">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/avatar.js"></script>
<script src="/game.js"></script>
<script src="/minigiochi.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<style>
@font-face{font-family:"Bagel Fat One";src:url("/fonts/bagel.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-800.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-800.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Caveat";src:url("/fonts/caveat-600.woff2") format("woff2");font-weight:600;font-display:swap}
</style>
<style>
/* Layout: phone game UI — one column, bottom tab bar, the home is a top-down family table with everyone's characters seated around it */
:root{
  --bg:#FDF2EC; --card:#FFFFFF; --ink:#3A1A1F; --muted:#8C6B6F; --line:#F0DDD5; --rim:#F3E3DE;
  --red:#E5412F; --red-deep:#B92E20; --red-soft:#FCE3DD; --gold:#FFB21E; --gold-deep:#E99C00; --gold-soft:#FFF1CF;
  --mint:#2E9D5B; --mint-soft:#DDF4E5; --sky:#E2ECFF; --pink:#FFE0E6; --white:#FFFFFF;
  --f-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.av{display:block;width:100%;height:auto;overflow:visible}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px calc(110px + env(safe-area-inset-bottom, 0px))}
.app.bare{padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:14px;background:var(--red);display:grid;place-items:center;box-shadow:0 8px 16px -10px var(--red)}
.logo svg{width:30px;height:22px}
.brand-text{min-width:0}
.brand-text b{display:block;font:400 1.4rem/1 var(--f-display)}
.brand-text small{display:block;font:800 .74rem/1.25 var(--f-body);letter-spacing:.06em;color:var(--red);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{width:56px;height:62px;flex:none;border:none;background:none;padding:0;cursor:pointer;position:relative}
.me-btn .edit{position:absolute;right:-2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.7rem;box-shadow:0 0 0 2px var(--bg)}

main{display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px}
.demo{background:var(--sky);border-radius:16px;padding:10px 14px;font-size:.86rem;font-weight:600;line-height:1.4;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* greeting */
.hello{display:flex;align-items:center;gap:12px}
.hello h1{margin:0;font:400 1.6rem/1.05 var(--f-display);text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:.92rem}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--ink)}

/* table scene */
.scene{background:var(--card);border-radius:30px;padding:18px 14px 16px;box-shadow:0 1px 0 var(--line),0 20px 36px -28px rgba(58,26,31,.55);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.scene-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px}
.scene-head h2{margin:0;font:400 1.3rem/1.1 var(--f-display)}
.scene-head p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-weight:800;font-size:.85rem;white-space:nowrap;background:var(--red);color:#fff}
.table-wrap{position:relative;width:100%;aspect-ratio:1/0.92;margin:0 auto;max-width:440px}
.tabletop{position:absolute;left:18%;right:18%;top:24%;bottom:24%;border-radius:50%;
  background-color:#fff;background-image:linear-gradient(90deg,rgba(229,65,47,.42) 50%,transparent 0),linear-gradient(rgba(229,65,47,.42) 50%,transparent 0);background-size:22px 22px;
  box-shadow:0 14px 0 -4px #C98B5A,0 22px 30px -14px rgba(58,26,31,.6),inset 0 0 0 4px rgba(255,255,255,.7)}
.dishplate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,var(--rim) 56% 59%,#fff 60%);box-shadow:0 10px 18px -8px rgba(58,26,31,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.dishplate b{font:400 clamp(.8rem,3.4vw,1.05rem)/1.05 var(--f-display);overflow-wrap:anywhere}
.dishplate span{font-size:.7rem;font-weight:800;color:var(--muted);line-height:1.15;margin-top:2px}
.dishplate .q{font:400 2rem/1 var(--f-display);color:var(--red)}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--sz);transition:transform .3s}
.seat .avw{width:100%;position:relative;filter:drop-shadow(0 6px 6px rgba(58,26,31,.2))}
.seat.no .avw{filter:grayscale(1) opacity(.5)}
.seat.unk .avw{opacity:.85}
.seat .nm{font-weight:800;font-size:.72rem;line-height:1.1;text-align:center;max-width:120%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 7px}
.seat .st{position:absolute;right:-4px;bottom:16%;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;box-shadow:0 0 0 2px #fff}
.seat.yes .st{background:var(--mint)}
.seat.no .st{background:#9A8A8C}
.seat.unk .st{background:var(--gold);color:var(--ink)}
.seat.chef .nm{background:var(--red);color:#fff}
.seat.me .nm{box-shadow:0 0 0 2px var(--gold)}
.tally{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:.82rem}
.tally span{border-radius:999px;padding:5px 11px;background:var(--bg)}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsvp .btn{min-height:54px}
.rsvp .btn.on-yes{background:var(--mint);color:#fff;box-shadow:0 10px 20px -12px var(--mint)}
.rsvp .btn.on-no{background:#6E5B5E;color:#fff}
.chefline{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:8px 12px 8px 8px}
.chefline .mini{width:44px;flex:none}
.chefline div{min-width:0}
.chefline b{display:block;font:400 1.05rem/1.15 var(--f-display);overflow-wrap:anywhere}
.chefline small{color:var(--muted);font-weight:700}
.quote{margin:0;font:600 1.35rem/1.15 var(--f-hand);color:var(--red-deep);text-align:center}

/* sections, cards */
.section{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.section-title,.page-title{margin:0;font:400 1.4rem/1.15 var(--f-display);text-wrap:balance}
.page-title{font-size:1.65rem}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 1px 0 var(--line),0 16px 30px -26px rgba(58,26,31,.5);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-title{margin:0;font:400 1.1rem var(--f-display)}
.card.empty{align-items:center;text-align:center;padding:30px 22px}
.card.empty p{margin:0;color:var(--muted);max-width:34ch}
.big-emoji{font-size:3rem;line-height:1}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.dishline{display:flex;align-items:center;gap:12px;min-width:0}
.dishline .mini{width:52px;flex:none}
.dishline > div{min-width:0}
.dishline strong{display:block;font:400 1.2rem/1.15 var(--f-display);overflow-wrap:anywhere}

/* vote */
.vote{display:flex;flex-direction:column;gap:14px}
.stars{display:flex;justify-content:space-between;gap:6px;max-width:360px}
.star{flex:1;aspect-ratio:1;max-width:62px;border:none;background:none;padding:2px;cursor:pointer;border-radius:16px}
.star svg{width:100%;height:100%;display:block;overflow:visible}
.star path{fill:var(--rim);stroke:#EACCC3;stroke-width:1.1;stroke-linejoin:round;transition:fill .18s}
.star.on path{fill:var(--gold);stroke:var(--gold-deep)}
.star.pop svg{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.star-word{font:600 1.7rem/1 var(--f-hand);color:var(--red-deep);min-height:1.1em}
.field{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:.92rem;min-width:0}
input[type=text],input[type=time],select,textarea{width:100%;font:600 1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:16px;padding:13px 14px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input::placeholder,textarea::placeholder{color:#B79C9F;font-weight:400}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
textarea{min-height:96px;resize:vertical;display:block}
.lock{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);font-weight:600}
.lock svg{flex:none}
.err{color:var(--red-deep);font-weight:800;font-size:.9rem}
.err:empty{display:none}
.teaser{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-weight:700;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn.block{flex:1 1 180px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{appearance:none;border:none;border-radius:999px;padding:13px 22px;font:800 1rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-decoration:none;transition:transform .1s;text-align:center}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.red{background:var(--red);color:var(--white);box-shadow:0 10px 20px -12px var(--red)}
.btn.soft{background:var(--red-soft);color:var(--red-deep)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 10px 20px -12px var(--gold-deep)}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:none;color:var(--red-deep);font:800 .9rem var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.link.danger{color:var(--white);background:var(--red);text-decoration:none;border-radius:999px;padding:6px 12px}
.btn:focus-visible,.star:focus-visible,.tab:focus-visible,.member:focus-visible,.link:focus-visible,.hrow:focus-visible,.opt:focus-visible,.cat:focus-visible,.me-btn:focus-visible,.seg button:focus-visible,.pcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* results */
.mine{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:16px;padding:8px 14px;font-weight:800;font-size:.9rem}
.mine > span{display:inline-flex;align-items:center;gap:8px}
.results{display:flex;flex-direction:column;gap:16px}
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font:400 3.4rem/1 var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.score.sm{font-size:2.2rem}
.mini-stars{display:inline-flex;gap:2px;vertical-align:middle}
.mini-stars svg{width:17px;height:17px;display:block}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:2.4rem 1fr 1.4rem;align-items:center;gap:8px;font-weight:800;font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;display:block}
.bar .fill{height:100%;background:var(--gold);border-radius:99px;display:block}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:4px 2px}
.note{padding:12px 14px 16px;border-radius:4px 4px 16px 4px;box-shadow:0 10px 16px -14px rgba(58,26,31,.6);transform:rotate(var(--r,0deg));display:flex;flex-direction:column;gap:6px;min-width:0}
.note p{margin:0;font:600 1.35rem/1.12 var(--f-hand);overflow-wrap:anywhere}

/* chef */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line)}
.seg button{border:none;background:none;border-radius:999px;padding:9px 8px;font:800 .9rem/1.2 var(--f-body);color:var(--muted);cursor:pointer}
.seg button small{display:block;font-weight:600;font-size:.76rem}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--white)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding-top:8px}
.member{border:2px solid transparent;background:var(--bg);border-radius:20px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:800 .9rem/1.2 var(--f-body);position:relative;overflow-wrap:anywhere;text-align:center}
.member .mav{width:76px}
.member[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.member[aria-checked="true"]::after{content:"Chef";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--white);font:800 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.suggest{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-size:.9rem;font-weight:600}
.wheel-card{overflow:hidden}
.wheel-box{position:relative;width:100%;max-width:340px;margin:0 auto;overflow:hidden}
.wheel-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 18px rgba(58,26,31,.28))}
.wheel-rot{transform:rotate(0deg)}
.wheel-empty{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;font-weight:800;color:var(--muted);font-size:.9rem;line-height:1.3;width:60%;margin-top:40px}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;font-weight:800;font-size:.86rem;max-width:100%}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip .wav{width:28px;flex:none}
.wchip button{border:none;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:2px 4px}
.wchip.win{background:var(--gold);color:var(--ink)}
.wresult{background:linear-gradient(160deg,#FFE7A8,var(--gold-soft));border-radius:20px;padding:14px 16px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.wresult b{font:400 1.6rem/1.1 var(--f-display)}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1;min-width:0}

/* crown */
.crowncard{background:linear-gradient(165deg,#FFE7A8,var(--gold-soft) 45%,var(--card));border-radius:30px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 1px 0 var(--line),0 20px 36px -28px rgba(233,156,0,.9);position:relative;overflow:hidden}
.crowncard .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 10deg,transparent 10deg 20deg);animation:spinr 30s linear infinite;opacity:.6}
@keyframes spinr{to{transform:rotate(360deg)}}
.crowncard > *{position:relative}
.crowncard .bigav{width:150px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.crowncard h2{margin:0;font:400 1.6rem/1.05 var(--f-display)}
.crowncard p{margin:0;color:var(--muted);font-weight:700}
.podium{display:grid;align-items:end;gap:10px;padding-top:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.step .name{font-weight:800;font-size:.92rem;overflow-wrap:anywhere;line-height:1.2}
.step .val{font:400 1.05rem var(--f-display)}
.step .pav{width:84px}
.pblock{width:100%;border-radius:18px 18px 6px 6px;display:grid;place-items:center;font:400 1.7rem var(--f-display);color:var(--white)}
.p1 .pblock{height:104px;background:linear-gradient(var(--gold),var(--gold-deep))}
.p2 .pblock{height:76px;background:linear-gradient(#CBD0D9,#A6ADBA)}
.p3 .pblock{height:58px;background:linear-gradient(#E6A87C,#C27B4C)}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:1.6rem 46px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.pos{font:400 1.1rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.rname{font-weight:800;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.rname small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.rval{font:400 1.1rem var(--f-display);white-space:nowrap}
.best-dish{font:400 1.6rem/1.08 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.card.best{background:linear-gradient(160deg,var(--gold-soft),var(--card) 70%)}

/* history */
.hist{display:flex;flex-direction:column;gap:12px}
.hitem{background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line),0 14px 26px -24px rgba(58,26,31,.5);overflow:hidden}
.hrow{display:grid;grid-template-columns:52px 44px 1fr auto;gap:10px;align-items:center;padding:10px 14px 10px 10px;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.date{background:var(--red-soft);border-radius:14px;text-align:center;padding:7px 0 5px;color:var(--red-deep)}
.date b{display:block;font:400 1.4rem/1 var(--f-display)}
.date span{font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em}
.hmain{min-width:0;display:flex;flex-direction:column}
.hmain strong{font:400 1.05rem/1.15 var(--f-display);overflow-wrap:anywhere}
.hval{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.hval b{font:400 1.3rem var(--f-display);color:var(--red)}
.hval small{font-weight:800;color:var(--muted);font-size:.78rem}
.hval .gold{color:var(--gold-deep);font-size:1rem}
.hbody{padding:4px 16px 18px}

/* family */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pcard{background:var(--card);border:none;border-radius:24px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 1px 0 var(--line),0 14px 26px -24px rgba(58,26,31,.5);position:relative;text-align:center;font:inherit}
.pcard .pav{width:100%;max-width:120px}
.pcard b{font:400 1.05rem/1.1 var(--f-display);overflow-wrap:anywhere}
.pcard small{font-weight:800;color:var(--muted);font-size:.75rem}
.pcard .you{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 9px;font-weight:800;font-size:.7rem}
.pcard.add{background:repeating-linear-gradient(45deg,var(--bg) 0 10px,#fff 10px 20px);border:2px dashed var(--line);justify-content:center;min-height:180px}
.pcard.add .plus{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:400 2rem/1 var(--f-display);box-shadow:0 10px 20px -12px var(--red)}
.codebox{background:var(--bg);border-radius:16px;padding:12px 14px;font:800 .9rem var(--f-body);word-break:break-all;user-select:all}

/* welcome / who */
.welcome{display:flex;flex-direction:column;gap:16px}
.hero-img{border-radius:28px;overflow:hidden;box-shadow:0 24px 40px -28px rgba(58,26,31,.7);aspect-ratio:4/3.4;background:#F7D9B8}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block}
.welcome h1{margin:0;font:400 2.1rem/1.02 var(--f-display);text-wrap:balance}
.welcome .lead{margin:0;font-size:1.05rem;color:var(--muted);max-width:42ch}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.center{text-align:center}

/* casa: mini world */
.casa-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wallet{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--ink);border-radius:999px;padding:7px 14px;font:400 1.15rem/1 var(--f-display);box-shadow:0 8px 16px -10px var(--gold-deep)}
.jobs-left{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.86rem;color:var(--muted)}
.jobs-left i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:inset 0 -2px 0 var(--gold-deep)}
.jobs-left i.off{background:var(--rim);box-shadow:none}
.world{position:relative;width:100%;aspect-ratio:1/1.18;border-radius:30px;overflow:hidden;
  background:linear-gradient(#9BD8FF 0 30%,#C9EDFF 30% 71%,#8CD47E 71%);box-shadow:0 1px 0 var(--line),0 20px 36px -28px rgba(58,26,31,.55);user-select:none;-webkit-user-select:none}
.world .sun{position:absolute;right:7%;top:3%;width:13%;aspect-ratio:1;border-radius:50%;background:#FFD54A;box-shadow:0 0 0 8px rgba(255,213,74,.35)}
.world .cloud{position:absolute;height:5%;border-radius:999px;background:#fff;opacity:.9}
.roof{position:absolute;left:4%;right:4%;top:4%;height:16%;clip-path:polygon(50% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(0deg,#E5412F 0 9px,#C9362A 9px 11px)}
.chimney{position:absolute;left:70%;top:6%;width:6%;height:9%;background:#B4532F;border-radius:3px 3px 0 0}
.house{position:absolute;left:7%;right:7%;top:19.5%;height:51.5%;background:#C98B5A;border-radius:6px;padding:5px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}
.room{position:relative;border:none;border-radius:6px;cursor:pointer;padding:0;overflow:hidden;font:inherit;color:var(--ink);text-align:left}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--floor)}
.room .rl{position:absolute;left:6px;top:6px;z-index:2;background:rgba(255,255,255,.94);border-radius:999px;padding:2px 8px;font:800 .68rem/1.4 var(--f-body);white-space:nowrap}
.room .deco{position:absolute;right:6%;bottom:14%;z-index:1;font-size:clamp(1.5rem,7.5vw,2.3rem);line-height:1;filter:drop-shadow(0 4px 2px rgba(58,26,31,.18))}
.room .coin{position:absolute;right:6px;top:6px;z-index:2;font-size:.95rem;animation:bob 1.8s ease-in-out infinite}
.room.here{box-shadow:inset 0 0 0 3px var(--gold)}
.r-cameretta{background:radial-gradient(circle,#FFC7D6 2px,transparent 2.5px) 0 0/16px 16px,#FFE0E8;--floor:#E8B28A}
.r-bagno{background:linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px) 0 0/14px 14px,#BFE3F5;--floor:#9CC9E0}
.r-cucina{background:linear-gradient(#FFF6DA 0 78%,transparent 78%),#fff;--floor:repeating-conic-gradient(#E5412F 0 25%,#fff 0 50%) 0 0/14px 14px}
.r-garage{background:repeating-linear-gradient(0deg,#D7D9DE 0 12px,#C9CCD3 12px 14px);--floor:#8E939C}
.yard{position:absolute;left:4%;right:4%;top:74%;bottom:3%;display:grid;grid-template-columns:1fr 1fr;gap:4%}
.spot{position:relative;border:none;border-radius:18px;cursor:pointer;font:inherit;color:var(--ink);overflow:hidden;padding:0}
.spot .rl{position:absolute;left:8px;top:6px;z-index:2;background:rgba(255,255,255,.94);border-radius:999px;padding:2px 8px;font:800 .68rem/1.4 var(--f-body)}
.spot .deco{position:absolute;right:8%;bottom:10%;font-size:clamp(1.4rem,7vw,2.1rem);line-height:1}
.spot .coin{position:absolute;right:8px;top:6px;font-size:.95rem;animation:bob 1.8s ease-in-out infinite}
.s-giardino{background:radial-gradient(circle at 30% 70%,#6FBF5E 0 18%,transparent 19%),radial-gradient(circle at 75% 80%,#6FBF5E 0 15%,transparent 16%),#7FCB6E}
.s-market{background:#FFF;box-shadow:inset 0 0 0 4px #fff}
.s-market::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:repeating-linear-gradient(90deg,#2E9D5B 0 14px,#fff 14px 28px);border-bottom:3px solid #23804A}
.s-market .rl{top:34%;background:var(--mint);color:#fff}
.s-market .deco{right:auto;left:10%}
.spot.here{box-shadow:inset 0 0 0 3px var(--gold)}
.walker{position:absolute;z-index:5;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.walker .avw{width:100%;filter:drop-shadow(0 5px 3px rgba(58,26,31,.25))}
.walker.walking .avw{animation:step .26s ease-in-out infinite}
@keyframes step{50%{transform:translateY(-7%) rotate(3deg)}}
.walker .tag{margin-top:-6%;background:var(--gold);color:var(--ink);font:800 .62rem/1.3 var(--f-body);border-radius:999px;padding:1px 7px;white-space:nowrap}
.walker.npc .tag{background:rgba(255,255,255,.94)}
.walker.npc .avw{animation:bob 3s ease-in-out infinite}
.jobcard .jt{display:flex;align-items:center;gap:12px}
.jobcard .je{font-size:2.6rem;line-height:1}
.jobcard h2{margin:0;font:400 1.3rem/1.1 var(--f-display)}
.jobcard p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:.92rem}
.shop-list{display:flex;flex-direction:column;gap:8px}
.sitem{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;min-height:56px}
.sitem .sn{font-weight:800;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.sitem .sn small{display:block;font-weight:700;color:var(--muted);font-size:.78rem}
.sitem.got{background:var(--mint-soft)}
.sitem.got .sn{text-decoration:line-through;text-decoration-color:rgba(46,157,91,.6)}
.sitem .buyer{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;color:var(--mint)}
.sitem .buyer div{width:34px}
.sitem .acts{display:flex;align-items:center;gap:4px}
.sitem .x{border:none;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:6px;font-size:1rem}
.btn.buy{min-height:42px;padding:8px 14px;font-size:.9rem;background:var(--gold);color:var(--ink)}
.btn.buy[disabled]{background:var(--rim);color:var(--muted);opacity:1}
.prog{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#5CC584);border-radius:99px}
.warn{background:var(--red-soft);color:var(--red-deep);border-radius:16px;padding:10px 14px;font-weight:800;font-size:.88rem}
.senza{background:var(--red-soft);color:var(--red-deep);border-radius:14px;padding:8px 12px;font-weight:800;font-size:.88rem}
/* mini game */
.game{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--gbg,#FFF6DA);animation:edin .25s ease}
.g-top{max-width:560px;width:100%;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:8px}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-row h2{margin:0;font:400 1.25rem/1.1 var(--f-display)}
.g-score{background:#fff;border-radius:999px;padding:6px 14px;font:400 1.2rem/1 var(--f-display);box-shadow:0 6px 14px -10px rgba(58,26,31,.6)}
.g-time{height:12px;border-radius:99px;background:rgba(255,255,255,.8);overflow:hidden}
.g-time span{display:block;height:100%;width:100%;background:var(--red);border-radius:99px;transform-origin:left}
.g-hint{font-weight:800;font-size:.86rem;color:var(--ink);opacity:.75}
.play{flex:1;position:relative;max-width:560px;width:100%;margin:0 auto;touch-action:manipulation;overflow:hidden}
.tgt{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#fff,#FFF1CF);box-shadow:0 10px 18px -10px rgba(58,26,31,.6),inset 0 -4px 0 rgba(0,0,0,.06);font-size:2.5rem;line-height:1;cursor:pointer;animation:tin .18s ease-out;padding:0}
.tgt.bad{background:radial-gradient(circle at 35% 30%,#fff,#FFD6DE)}
.tgt.out{animation:tout .25s ease-in forwards}
@keyframes tin{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes tout{to{transform:translate(-50%,-50%) scale(0);opacity:0}}
.fx{position:absolute;transform:translate(-50%,-50%);font:400 1.5rem/1 var(--f-display);pointer-events:none;animation:fx .7s ease-out forwards;color:var(--gold-deep);text-shadow:0 2px 0 #fff}
.fx.minus{color:var(--red)}
@keyframes fx{to{transform:translate(-50%,-160%);opacity:0}}
.g-big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.g-big b{font:400 4.5rem/1 var(--f-display);color:var(--red)}
.g-big h3{margin:0;font:400 1.8rem/1.1 var(--f-display)}
.g-big p{margin:0;font-weight:700;color:var(--muted);max-width:30ch}
.g-big .coins{font:400 3rem/1 var(--f-display);color:var(--gold-deep)}
.play.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* città */
.city-card{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:16/11;background:#8ACF7D;box-shadow:0 1px 0 var(--line),0 20px 36px -26px rgba(58,26,31,.6)}
.city-prev{position:absolute;inset:0;width:100%;height:100%;display:block}
.city-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:16px;background:linear-gradient(transparent 40%,rgba(58,26,31,.45))}
.city-me{width:96px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.city-play{font-size:1.08rem;min-height:56px;padding:14px 26px}
.city-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.city-stats div{background:var(--card);border-radius:18px;padding:10px 8px;text-align:center;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.city-stats b{font:400 1.35rem/1 var(--f-display);color:var(--red)}
.city-stats span{font-size:.72rem;font-weight:800;color:var(--muted);line-height:1.2}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:.92rem}
.city{position:fixed;inset:0;z-index:65;background:#6FBF63;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.city.fade{animation:cfade .45s ease}
@keyframes cfade{0%{filter:brightness(.2)}100%{filter:none}}
.city-cv{position:absolute;inset:0;display:block}
.city-hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;pointer-events:none}
.city-hud > *{pointer-events:auto}
.ch-sp{flex:1}
.ch-btn{width:42px;height:42px;border-radius:14px;border:none;background:rgba(255,255,255,.95);font:800 1.05rem var(--f-body);color:var(--ink);cursor:pointer;box-shadow:0 6px 14px -8px rgba(0,0,0,.5);display:grid;place-items:center;flex:none}
.ch-place,.ch-wallet,.ch-jobs{background:rgba(255,255,255,.95);border-radius:999px;padding:8px 12px;font:800 .86rem/1 var(--f-body);box-shadow:0 6px 14px -8px rgba(0,0,0,.5);white-space:nowrap}
.ch-wallet{background:var(--gold);font:400 1.05rem/1 var(--f-display);padding:8px 12px}
.ch-msg{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.88rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);pointer-events:none}
.ch-pad{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);touch-action:none}
.ch-pad span{position:absolute;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:1.05rem;color:var(--ink);box-shadow:0 6px 12px -6px rgba(0,0,0,.5);pointer-events:none}
.ch-pad .u{left:50px;top:4px}.ch-pad .d{left:50px;bottom:4px}.ch-pad .l{left:4px;top:50px}.ch-pad .r{right:4px;top:50px}
.ch-pad i{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.7)}
.ch-pad[data-dir="u"] .u,.ch-pad[data-dir="d"] .d,.ch-pad[data-dir="l"] .l,.ch-pad[data-dir="r"] .r{background:var(--gold);transform:scale(.94)}
.ch-a{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:none;background:rgba(255,255,255,.55);color:rgba(58,26,31,.4);font:400 2rem/1 var(--f-display);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08);cursor:pointer}
.ch-a.on{background:var(--red);color:#fff;box-shadow:0 10px 20px -8px var(--red),inset 0 -5px 0 rgba(0,0,0,.15);animation:apulse 1.2s ease-in-out infinite}
@keyframes apulse{50%{transform:scale(1.06)}}
.ch-alabel{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.85rem;box-shadow:0 8px 16px -10px rgba(0,0,0,.6);max-width:60%;text-align:center}
.ch-modal{position:absolute;inset:0;background:rgba(30,15,18,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px 10px calc(10px + env(safe-area-inset-bottom,0px));animation:edin .2s ease}
.ch-sheet{width:100%;max-width:540px;max-height:calc(100% - 20px);overflow-y:auto;background:var(--bg);border-radius:28px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.5)}
.ch-sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch-sh-title{display:flex;align-items:center;gap:10px;min-width:0}
.ch-sh-title span{font-size:2.2rem;line-height:1}
.ch-sh-title b{display:block;font:400 1.3rem/1.1 var(--f-display)}
.ch-sh-title small{display:block;font-weight:700;color:var(--muted);font-size:.86rem}
.ch-sh-p{margin:0;color:var(--muted);font-weight:600;font-size:.92rem}
.ch-mapcv{display:block;margin:0 auto;border-radius:16px;box-shadow:0 0 0 3px #fff}
.shopcard{box-shadow:none}

/* coinvolgimento */
.ban{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 14px 26px -18px rgba(0,0,0,.7)}
.ban-ico{font-size:2.2rem;line-height:1}
.ban b{display:block;font:400 1.1rem/1.15 var(--f-display)}
.ban p{margin:2px 0 0;font-size:.88rem;font-weight:600;opacity:.85}
.rule{margin:0;font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.35}
.pen{position:fixed;inset:0;z-index:95;background:rgba(30,10,14,.72);display:grid;place-items:center;padding:20px;animation:edin .25s ease}
.pen-card{background:var(--card);border-radius:30px;padding:26px 22px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.pen-ico{font-size:3.6rem;line-height:1;animation:pop .5s ease}
.pen-card h2{margin:0;font:400 1.7rem/1.05 var(--f-display);color:var(--red)}
.pen-card p{margin:0;font-weight:600;color:var(--muted)}
.pen-coins{display:flex;align-items:center;gap:12px;font:400 1.6rem/1 var(--f-display)}
.pen-coins s{color:var(--muted)}
.pen-coins b{font-weight:400;color:var(--red)}
.pen-card small{font-weight:800;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{background:var(--gold-soft);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.78rem;white-space:nowrap}
.mis{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:18px;padding:10px}
.mis-ico{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font:400 1rem var(--f-display);color:var(--muted)}
.mis.done .mis-ico{background:var(--gold);color:var(--ink)}
.mis.got .mis-ico{background:var(--mint);color:#fff}
.mis-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.mis-main b{font-weight:800;font-size:.92rem;line-height:1.2}
.mis-main small{font-weight:700;color:var(--muted);font-size:.74rem}
.mis-bar{height:8px;border-radius:99px;background:#fff;overflow:hidden}
.mis-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFCF5C);border-radius:99px}
.mis.got .mis-bar span{background:var(--mint)}
.mis-btn{min-height:40px;padding:8px 12px;font-size:.84rem}
.mis-ok{font-weight:800;color:var(--mint);font-size:.86rem;white-space:nowrap}
.streakbar,.eventb{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.streakbar .fire{font-size:2rem;line-height:1}
.streakbar b,.eventb b{display:block;font:400 1.05rem/1.15 var(--f-display)}
.streakbar small,.eventb small{display:block;font-weight:700;color:var(--muted);font-size:.82rem;line-height:1.3}
.eventb{background:linear-gradient(120deg,#3B2252,#6A3C8F);color:#fff}
.eventb small{color:rgba(255,255,255,.82)}
.eventb > span{font-size:2rem;line-height:1}
.secret{flex-direction:row;align-items:center;background:linear-gradient(140deg,#F2E8FF,var(--card) 70%)}
.secret .big-emoji{font-size:2.6rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:2px solid transparent;background:var(--bg);border-radius:999px;padding:3px 12px 3px 3px;font:800 .86rem var(--f-body);cursor:pointer;color:var(--ink)}
.pchip div{width:32px}
.pchip[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.pchip[disabled]{opacity:.45}
.glog{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-weight:700}
.rrow.me{background:var(--gold-soft);border-radius:14px;padding-inline:6px}
.sub{margin:6px 2px 8px;font:800 .76rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.witem{position:relative;border:2px solid transparent;background:var(--bg);border-radius:20px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.witem.shop{cursor:default}
.witem.on{border-color:var(--mint);background:var(--mint-soft)}
.witem b{font-weight:800;font-size:.82rem;line-height:1.2}
.witem small{font-weight:700;color:var(--muted);font-size:.72rem}
.wprev{width:84px}
.wbtn{min-height:38px;padding:7px 12px;font-size:.82rem;width:100%}
.wev{position:absolute;top:6px;left:6px;background:#6A3C8F;color:#fff;border-radius:999px;padding:1px 8px;font-weight:800;font-size:.66rem}
.wtag{background:var(--gold-soft);border-radius:999px;padding:3px 8px}
.wgift{font-size:.8rem;padding:2px 0}
.grow{display:flex;flex-direction:column;gap:8px}
.gitem{background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.gitem b{font-weight:800}
.gitem small{font-weight:700;color:var(--muted);font-size:.78rem}
.gitem.ok{background:var(--mint-soft)}
.gitem.ok small{color:var(--mint)}
.how-card summary{font:400 1.1rem var(--f-display);cursor:pointer;list-style:none}
.how-card summary::-webkit-details-marker{display:none}
.senza.ok{background:#F2E8FF;color:#5B3A8C}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line)}
.tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:none;background:none;border-radius:16px;padding:7px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 .66rem var(--f-body);min-width:0;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--red);background:var(--red-soft)}

/* editor */
.editor{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:edin .28s cubic-bezier(.2,.9,.3,1)}
@keyframes edin{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.ed-inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;padding:calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px))}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ed-top h2{margin:0;font:400 1.2rem var(--f-display);text-align:center;flex:1}
.ed-top .btn{min-height:42px;padding:9px 16px;font-size:.92rem}
.ed-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:6px 0 0;
  background:radial-gradient(ellipse 60% 22% at 50% 96%,rgba(58,26,31,.16),transparent 70%)}
.ed-stage .bigav{width:min(190px,46vw);animation:bob 2.6s ease-in-out infinite}
.ed-stage .bigav.wiggle{animation:wig .45s ease}
@keyframes wig{30%{transform:rotate(-5deg) scale(1.04)}60%{transform:rotate(4deg)}100%{transform:none}}
.dice{position:absolute;right:0;bottom:12px;width:52px;height:52px;border-radius:16px;border:none;background:var(--card);box-shadow:0 1px 0 var(--line),0 10px 20px -14px rgba(58,26,31,.6);font-size:1.6rem;cursor:pointer}
.dice span{display:block;font:800 .58rem var(--f-body);color:var(--muted);margin-top:-2px}
.ed-name{margin:10px 0 8px}
.ed-name input{background:#fff;border-color:var(--line);font-size:1.05rem}
.presets{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;border:2px solid transparent;background:var(--card);border-radius:18px;padding:6px 6px 4px;width:74px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font:800 .72rem var(--f-body)}
.preset:focus-visible{outline:3px solid var(--gold)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;flex:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:none;background:var(--card);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 .72rem var(--f-body);color:var(--muted);cursor:pointer;min-width:66px;box-shadow:0 1px 0 var(--line)}
.cat i{font-style:normal;font-size:1.3rem;line-height:1}
.cat[aria-pressed="true"]{background:var(--red);color:#fff}
.ed-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:24px 24px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom, 0px));box-shadow:0 -1px 0 var(--line)}
.ed-panel h3{margin:4px 2px 10px;font:800 .78rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ed-panel h3:not(:first-child){margin-top:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.opt{border:3px solid transparent;background:var(--bg);border-radius:18px;padding:4px 4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:800 .72rem/1.2 var(--f-body);color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red-deep)}
.opt .oav{width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),inset 0 -6px 10px rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--red),inset 0 -6px 10px rgba(0,0,0,.12);transform:scale(1.08)}
.sw:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.toggle-row{display:flex;gap:10px;flex-wrap:wrap}
.toggle{border:none;border-radius:999px;padding:10px 16px;font:800 .9rem var(--f-body);background:var(--bg);color:var(--ink);cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--red);color:#fff}
.ed-save{position:sticky;bottom:0;margin-top:16px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:999px;font-weight:800;font-size:.92rem;z-index:80;box-shadow:0 14px 30px -14px rgba(58,26,31,.8);max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:toast .3s ease}
@keyframes toast{from{transform:translate(-50%,12px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--muted);font-weight:700}
.loader .mini{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,var(--rim) 56% 59%,#fff 60%);box-shadow:0 10px 20px -12px rgba(58,26,31,.5);animation:spin 1.6s ease-in-out infinite}
@keyframes spin{50%{transform:scale(.9)}}
/* ===== minigiochi: cornice comune ===== */
.g-acts{display:flex;gap:8px;align-items:center}
.g-mute{width:40px;height:40px;border-radius:14px;border:none;background:#fff;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 14px -10px rgba(58,26,31,.6)}
.g-score.bump{animation:pop .3s ease}
.play{user-select:none;-webkit-user-select:none;touch-action:none}
.g-intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px 22px;overflow-y:auto}
.g-intro .gi-ico{font-size:4rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
.g-intro h3{margin:0;font:400 1.75rem/1.05 var(--f-display)}
.g-lv{display:inline-flex;gap:4px;align-items:center;background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
.g-lv small{font-weight:700;color:var(--muted)}
.g-how{margin:0;font-weight:700;color:var(--ink);opacity:.85;max-width:34ch;line-height:1.35}
.g-recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.g-recs > div{background:rgba(255,255,255,.88);border-radius:18px;padding:9px 6px;font-weight:800;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.g-recs b{font:400 1.5rem/1 var(--f-display);color:var(--red)}
.g-recs small{color:var(--muted);font-weight:700}
.g-chal{margin:0;background:var(--gold);color:var(--ink);border-radius:14px;padding:7px 12px;font-weight:800;font-size:.88rem}
.g-pay{margin:0;font-weight:800;color:var(--muted);font-size:.86rem;max-width:34ch}
.g-intro .btn{min-width:200px}
.g-end .g-final{font:400 5rem/1 var(--f-display);color:var(--red)}
.g-end h3{font-size:1.5rem}
.g-up{margin:0;background:var(--mint-soft);color:var(--mint);border-radius:14px;padding:7px 12px;font-weight:800}
.g-say{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.95rem;white-space:nowrap;z-index:20;animation:gsay 1.05s ease forwards;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@keyframes gsay{0%{opacity:0;transform:translate(-50%,8px) scale(.9)}14%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.fx{z-index:21}

/* 1 pizzeria */
.pz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 12px 12px}
.pz-ticket{background:#fff;border-radius:6px 6px 16px 16px;padding:8px 16px 10px;box-shadow:0 10px 18px -14px rgba(58,26,31,.7);text-align:center;border-top:6px dashed #F0DDD5;min-width:220px}
.pz-ticket small{display:block;font-weight:800;color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.pz-ticket b{display:block;font:400 1.35rem/1.1 var(--f-display)}
.pz-seq{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:4px;font-size:1.6rem;line-height:1}
.pz-seq i{font-style:normal;color:var(--muted);font-size:1rem}
.pz-seq span{border-radius:12px;padding:3px 4px;opacity:.45}
.pz-seq span.nx{opacity:1;background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);animation:pop .6s ease infinite alternate}
.pz-seq span.ok{opacity:1;filter:grayscale(.2)}
.pz-stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
.pz-dough{position:relative;width:min(64vw,250px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#F7DFAF 0 62%,#E8BE7A 64% 100%);box-shadow:0 14px 24px -14px rgba(58,26,31,.7),inset 0 -6px 0 rgba(0,0,0,.06);transition:transform .45s ease,opacity .45s ease}
.pz-dough.sauce::before{content:"";position:absolute;inset:11%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#E8513A,#C7321F);animation:pop .3s ease}
.pz-dough.baking{animation:wig 1.6s ease-in-out infinite}
.pz-dough.out{transform:translateX(120%) rotate(40deg);opacity:0}
.pz-t,.pz-moz{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));animation:pop .3s ease}
.pz-t{font-size:clamp(1.1rem,6vw,1.6rem);line-height:1}
.pz-moz{width:13%;aspect-ratio:1.2;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#F4EEDF);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pz-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}
.pz-b{border:none;background:#fff;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;box-shadow:0 6px 0 #F0DDD5;font:inherit;color:var(--ink)}
.pz-b span{font-size:1.8rem;line-height:1.1}
.pz-b small{font-weight:800;font-size:.7rem;color:var(--muted)}
.pz-b:active{transform:translateY(3px);box-shadow:0 3px 0 #F0DDD5}
.pz-b.no{animation:shk .3s;background:var(--red-soft)}
.pz-oven{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;background:#3A1A1F;border-radius:22px;padding:12px;color:#fff}
.pz-ov-h{font-weight:800;text-align:center}
.pz-bar{position:relative;height:30px;border-radius:12px;overflow:hidden;background:#EADCC4}
.pz-bar i{position:absolute;top:0;bottom:0}
.pz-needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #3A1A1F;left:0}
.pz-lbl{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;opacity:.8}
.pz-go{font-size:1.15rem;min-height:56px}

/* 2 lavanderia */
.lv{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px 14px;gap:10px}
.lv-area{flex:1;position:relative;display:grid;place-items:center;min-height:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.8),transparent 65%)}
.lv-item{width:min(52vw,210px);aspect-ratio:1;cursor:grab;filter:drop-shadow(0 12px 12px rgba(58,26,31,.25));touch-action:none}
.lv-item svg{width:100%;height:100%;display:block}
.lv-item.in{animation:tin .2s ease-out}
.lv-item.fly{transition:transform .2s ease-in,opacity .2s}
.lv-item.fly.l{transform:translate(-90%,70%) scale(.3)!important;opacity:0}
.lv-item.fly.r{transform:translate(90%,70%) scale(.3)!important;opacity:0}
.lv-item.fly.d{transform:translateY(60%) scale(.4)!important;opacity:0}
@keyframes tin{from{transform:scale(.2)}to{transform:scale(1)}}
.lv-ring{position:absolute;left:15%;right:15%;top:4px;height:10px;border-radius:99px;background:rgba(255,255,255,.8);overflow:hidden}
.lv-ring span{display:block;height:100%;background:var(--gold);border-radius:99px;width:100%}
.lv-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv-bk{border:none;border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 7px 0 rgba(58,26,31,.15)}
.lv-bk.l{background:#fff}
.lv-bk.r{background:linear-gradient(135deg,#FFD6DE,#FFE9B8,#D6F1E0,#DCE8FF)}
.lv-bk .lv-b{font-size:2.2rem;line-height:1}
.lv-bk b{font:400 1.15rem var(--f-display)}
.lv-bk small{font-weight:800;color:var(--muted);font-size:.74rem}
.lv-bk.hit{animation:pop .35s ease}

/* 3 serra */
.sr{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;padding:16px 12px 22px;background:linear-gradient(transparent 70%,rgba(110,170,90,.25))}
.sr-pot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:none;height:100%;justify-content:flex-end;border-radius:22px;padding:6px 0}
.sr-pot.on{background:rgba(255,255,255,.45)}
.sr-pot small{font-weight:800;font-size:.68rem;color:var(--muted);text-align:center}
.sr-tube{position:relative;width:46px;flex:1;max-height:260px;border-radius:16px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 3px #fff,0 6px 12px -8px rgba(0,0,0,.4);overflow:hidden}
.sr-band{position:absolute;left:0;right:0;background:rgba(46,157,91,.28);border-top:3px solid #2E9D5B;border-bottom:3px solid #2E9D5B}
.sr-water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7FD0F2,#3E9BE0);opacity:.9}
.sr-water.ok{background:linear-gradient(#8BE3A6,#2E9D5B)}
.sr-pot.on .sr-water::before{content:"";position:absolute;left:0;right:0;top:-4px;height:8px;background:inherit;border-radius:50%}
.sr-plant{font-size:2.6rem;line-height:1;margin-bottom:-10px;z-index:1}
.sr-plant.grow{animation:pop .5s ease}
.sr-vase{width:70px;height:46px;background:linear-gradient(#D9773F,#B4532F);clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);border-radius:4px}
.sr-pot.wet{animation:shk .3s}

/* 4 gelateria */
.gl{position:absolute;inset:0;overflow:hidden;cursor:pointer;background:linear-gradient(#E4F7F7,#C9EEF0)}
.gl-world{position:absolute;inset:0;transition:transform .35s ease}
.gl-cone{position:absolute;bottom:20px;width:74px;height:90px;margin-left:-37px;background:repeating-linear-gradient(45deg,#E2A65A 0 8px,#C98B3E 8px 10px),#E2A65A;clip-path:polygon(0 0,100% 0,50% 100%)}
.gl-scoop{position:absolute;width:74px;height:64px;margin-left:-37px;border-radius:50% 50% 44% 44%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 4px 0 rgba(0,0,0,.05)}
.gl-mov{top:70px}
.gl-scoop.drop{transition:transform .6s ease-in,opacity .6s;opacity:0}
.gl-scoop.drop.r{transform:translate(60px,220px) rotate(90deg)}
.gl-scoop.drop.l{transform:translate(-60px,220px) rotate(-90deg)}
.gl-st{animation:sq .25s ease}
@keyframes sq{0%{transform:scaleY(.8) scaleX(1.15)}100%{transform:none}}
.gl-hearts{position:absolute;left:12px;top:10px;font-size:1.2rem;letter-spacing:2px}
.gl-h{position:absolute;right:12px;top:12px;background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem}

/* 5 porto */
.pt{position:absolute;inset:0;overflow:hidden;cursor:pointer}
.pt-sky{position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(#9BD8FF,#DDF1FF)}
.pt-sea{position:absolute;left:0;right:0;top:34%;bottom:0;background:linear-gradient(#4FB3E8,#1F6FB3)}
.pt-sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 26px,rgba(255,255,255,.15) 26px 30px)}
.pt-dock{position:absolute;left:0;top:22%;width:34%;height:12%;background:#A8743E;border-radius:0 8px 8px 0;font-size:2.4rem;display:flex;align-items:flex-start;justify-content:flex-end;padding-right:12px;line-height:0}
.pt-line{position:absolute;left:31%;top:12%;width:30%;height:44%;border-top:2px solid rgba(58,26,31,.6);border-right:2px solid rgba(58,26,31,.6);border-radius:0 80px 0 0}
.pt-bob{position:absolute;left:61%;top:52%;width:30px;height:30px;margin:-15px;border-radius:50%;background:linear-gradient(#E5412F 50%,#fff 50%);box-shadow:0 0 0 2px #3A1A1F;transition:top .15s}
.pt-bob.float{animation:bob 1.4s ease-in-out infinite}
.pt-bob.dip{top:56%;animation:shk .25s infinite}
.pt-ex{position:absolute;left:61%;top:36%;transform:translateX(-50%);font-size:3rem;animation:pop .3s ease infinite alternate}
.pt-fin{position:absolute;top:58%;left:-20%;font-size:3rem;opacity:0}
.pt-fin.go{animation:fin 1.5s linear forwards}
@keyframes fin{0%{left:-20%;opacity:1}100%{left:110%;opacity:1}}
.pt-st{position:absolute;left:50%;top:72%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:8px 16px;font-weight:800;white-space:nowrap}
.pt[data-s="bite"] .pt-st{background:var(--red);color:#fff}
.pt-bucket{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.3);border-radius:16px;padding:4px 10px;font-size:1.5rem;min-height:44px}
.pt-fish{animation:pop .3s ease}

/* 6 biblioteca */
.bb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 12px 18px;gap:12px}
.bb-st{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800}
.bb-shelf{display:flex;gap:6px;align-items:flex-end;justify-content:center;background:#8A5A35;border-radius:10px;padding:14px 12px 0;min-height:150px;box-shadow:inset 0 -12px 0 #6E4527,0 14px 24px -16px rgba(0,0,0,.6);flex-wrap:nowrap;max-width:100%}
.bb-slot{width:32px;height:118px;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.15);display:grid;place-items:center;font:400 1.2rem var(--f-display);color:#fff;margin-bottom:12px}
.bb-slot.show{background:var(--c);box-shadow:inset 0 10px 0 rgba(255,255,255,.25),inset 0 -14px 0 rgba(0,0,0,.12);animation:pop .3s ease}
.bb-slot.hid{background:#B07A4E}
.bb-slot.bad{outline:4px solid #fff}
.bb-pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bb-book{width:58px;height:96px;border:none;border-radius:8px 8px 4px 4px;background:var(--c);cursor:pointer;box-shadow:inset 0 14px 0 rgba(255,255,255,.25),inset 0 -18px 0 rgba(0,0,0,.12),0 6px 0 rgba(0,0,0,.15);position:relative}
.bb-book i{position:absolute;left:12px;right:12px;top:40%;height:6px;border-radius:3px;background:rgba(255,255,255,.6)}
.bb-book[disabled]{opacity:.55}
.bb-book.hit{animation:pop .25s ease}

/* 7 officina */
.of{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;padding:12px}
.of-svg{width:min(84vw,330px);height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.25))}

/* 8 cucina */
.ck{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 1px,transparent 1px 40px)}

.cm{position:absolute;inset:0;overflow:hidden}

.cm-box span{font-size:2rem;line-height:1}

.cm-box.hit{animation:pop .3s ease}
.cm-it{position:absolute;font-size:2.7rem;line-height:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg));cursor:grab;touch-action:none;filter:drop-shadow(0 6px 4px rgba(58,26,31,.3));transition:left .2s,top .2s,transform .2s,opacity .2s;z-index:2}
.cm-it.drag{transition:none;transform:translate(-50%,-50%) scale(1.25);z-index:5}
.cm-it.sel{transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px var(--gold))}
.cm-it.gone{opacity:0;transform:translate(-50%,40%) scale(.2)}

/* 10 luna park */
.lp{position:absolute;inset:0;overflow:hidden;cursor:crosshair;background:linear-gradient(#3B2252,#6A3C8F)}
.lp-lane{position:absolute;left:0;right:0;height:20%;background:repeating-linear-gradient(90deg,#E5412F 0 30px,#fff 30px 60px);opacity:.18;border-bottom:6px solid rgba(255,255,255,.4)}

.lp-t.down{transition:transform .35s ease-in,opacity .35s;transform:translate(-50%,40%) rotate(80deg);opacity:0}
.lp-ammo{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 14px;font-weight:800;text-align:center;letter-spacing:3px;color:var(--red)}

/* ===== nuove parti dell'app ===== */

/* pronostico */
.pr{background:linear-gradient(160deg,#F2E8FF,var(--card) 60%)}

.pr-who{display:flex;flex-wrap:wrap;gap:6px}
.pr-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-weight:800;font-size:.82rem;box-shadow:0 1px 0 var(--line)}

/* voto a categorie */
.crows{display:flex;flex-direction:column;gap:10px}

.dish-art{width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 58%,#fff 0 30%,hsl(calc(var(--h,20) * 1deg),70%,92%) 31% 34%,hsl(calc(var(--h,20) * 1deg),75%,86%) 35%)}

/* album */
.album{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.a-cap strong{font:400 .98rem/1.15 var(--f-display);overflow-wrap:anywhere}

/* ricettario */
.rb-cta{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;background:linear-gradient(140deg,var(--gold-soft),var(--card) 70%)}

/* spesa vera */
.sitem.claimed{background:var(--gold-soft)}
.sitem .cl-av{width:32px}

/* sfide */
.ch-list{display:flex;flex-direction:column;gap:8px}

.ch-recs small{color:var(--muted);font-weight:700}

/* rivelazione */
.rv{position:fixed;inset:0;z-index:96;display:flex;flex-direction:column;color:#fff;background:radial-gradient(ellipse at 50% 30%,#6A3C8F,#2A1538 70%);animation:edin .3s ease}
.rv::before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.06) 0 8deg,transparent 8deg 16deg);animation:spinr 40s linear infinite;pointer-events:none}
.rv > *{position:relative}
.rv-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 6px;max-width:560px;width:100%;margin:0 auto}

.rv-kick{margin:0;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--gold)}

.rv-chef .rv-mini{width:40px}
.rv-note{color:var(--ink);border-radius:6px 6px 22px 6px;padding:18px 20px 22px;transform:rotate(var(--r));max-width:340px;width:100%;box-shadow:0 24px 40px -20px rgba(0,0,0,.7);animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(80deg) rotate(var(--r))}to{transform:rotate(var(--r))}}
.rv-note p{margin:6px 0 0;font:600 2.1rem/1.1 var(--f-hand);overflow-wrap:anywhere}
.rv-ns{display:flex;align-items:center;justify-content:center;gap:8px}

.rv-catline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

async function shareCard(id){

function printKit(kind, id){

      h("div",{html:crownSvg(chef ? chef.name.toUpperCase() : "CHEF")}), h("div",{html:stripSvg()}), h("div",{html:stripSvg()}), h("p",{class:"pr-small"}, "Dinner Crown · " + fname)));

      pages.push(h("section",{class:"pr-page pr-recipe"}, dishArt(rc, "pr-art"), h("h1",null, rc.dish), h("p",{class:"pr-meta"}, "di " + chefOf(rc).name + " · " + fmtLong(rid) + (rv.length ? " · " + fmtAvg(avgOf(rv)) + " ★" : "")),

/* ---------- feedback ---------- */
let toastT = 0;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); if(!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth*dpr, H = cv.height = innerHeight*dpr;
  cv.hidden = false;
  const cols = ["#E5412F","#FFB21E","#2E9D5B","#5B8DEF","#FF8FA8"];
  const ps = Array.from({length:120}, () => ({ x:W/2, y:H*.6, vx:(Math.random()-.5)*W*.03, vy:-(Math.random()*H*.018 + H*.01), r:(Math.random()*6+5)*dpr, c:cols[Math.random()*5|0], a:Math.random()*6, va:(Math.random()-.5)*.35 }));
  const g = H*.0007, t0 = performance.now();
  (function frame(t){ ctx.clearRect(0,0,W,H); ps.forEach(p => { p.vy += g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(t - t0 < 2400) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; } })(t0);
}

/* ---------- render ---------- */
const VIEW_FN = { cena:viewCena, chef:viewChef, gioca:viewGioca, corona:viewCorona, famiglia:viewFamiglia };
function saveFocus(){ const a = document.activeElement; return a && a.id && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null; }
