<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinner Crown · La cena di famiglia</title>
<meta name="description" content="Crea il tuo personaggio, a turno uno fa lo chef, tutti votano in segreto e chi vince porta la corona.">
<meta name="theme-color" content="#FDF2EC">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/bagel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinner Crown">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/avatar.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<style>
@font-face{font-family:"Bagel Fat One";src:url("/fonts/bagel.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Nunito";src:url("/fonts/nunito-800.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Caveat";src:url("/fonts/caveat-600.woff2") format("woff2");font-weight:600;font-display:swap}
/* Layout: phone game UI — one column, bottom tab bar, the home is a top-down family table with everyone's characters seated around it */
:root{
  --bg:#FDF2EC; --card:#FFFFFF; --ink:#3A1A1F; --muted:#8C6B6F; --line:#F0DDD5; --rim:#F3E3DE;
  --red:#E5412F; --red-deep:#B92E20; --red-soft:#FCE3DD; --gold:#FFB21E; --gold-deep:#E99C00; --gold-soft:#FFF1CF;
  --mint:#2E9D5B; --mint-soft:#DDF4E5; --sky:#E2ECFF; --pink:#FFE0E6; --white:#FFFFFF;
  --f-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.av{display:block;width:100%;height:auto;overflow:visible}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px calc(110px + env(safe-area-inset-bottom, 0px))}
.app.bare{padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:14px;background:var(--red);display:grid;place-items:center;box-shadow:0 8px 16px -10px var(--red)}
.logo svg{width:30px;height:22px}
.brand-text{min-width:0}
.brand-text b{display:block;font:400 1.4rem/1 var(--f-display)}
.brand-text small{display:block;font:800 .74rem/1.25 var(--f-body);letter-spacing:.06em;color:var(--red);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{width:56px;height:62px;flex:none;border:none;background:none;padding:0;cursor:pointer;position:relative}
.me-btn .edit{position:absolute;right:-2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.7rem;box-shadow:0 0 0 2px var(--bg)}

main{display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px}
.demo{background:var(--sky);border-radius:16px;padding:10px 14px;font-size:.86rem;font-weight:600;line-height:1.4;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* greeting */
.hello{display:flex;align-items:center;gap:12px}
.hello h1{margin:0;font:400 1.6rem/1.05 var(--f-display);text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:.92rem}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--ink)}

/* table scene */
.scene{background:var(--card);border-radius:30px;padding:18px 14px 16px;box-shadow:0 1px 0 var(--line),0 20px 36px -28px rgba(58,26,31,.55);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.scene-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px}
.scene-head h2{margin:0;font:400 1.3rem/1.1 var(--f-display)}
.scene-head p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-weight:800;font-size:.85rem;white-space:nowrap;background:var(--red);color:#fff}
.table-wrap{position:relative;width:100%;aspect-ratio:1/0.92;margin:0 auto;max-width:440px}
.tabletop{position:absolute;left:18%;right:18%;top:24%;bottom:24%;border-radius:50%;
  background-color:#fff;background-image:linear-gradient(90deg,rgba(229,65,47,.42) 50%,transparent 0),linear-gradient(rgba(229,65,47,.42) 50%,transparent 0);background-size:22px 22px;
  box-shadow:0 14px 0 -4px #C98B5A,0 22px 30px -14px rgba(58,26,31,.6),inset 0 0 0 4px rgba(255,255,255,.7)}
.dishplate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,var(--rim) 56% 59%,#fff 60%);box-shadow:0 10px 18px -8px rgba(58,26,31,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.dishplate b{font:400 clamp(.8rem,3.4vw,1.05rem)/1.05 var(--f-display);overflow-wrap:anywhere}
.dishplate span{font-size:.7rem;font-weight:800;color:var(--muted);line-height:1.15;margin-top:2px}
.dishplate .q{font:400 2rem/1 var(--f-display);color:var(--red)}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--sz);transition:transform .3s}
.seat .avw{width:100%;position:relative;filter:drop-shadow(0 6px 6px rgba(58,26,31,.2))}
.seat.no .avw{filter:grayscale(1) opacity(.5)}
.seat.unk .avw{opacity:.85}
.seat .nm{font-weight:800;font-size:.72rem;line-height:1.1;text-align:center;max-width:120%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 7px}
.seat .st{position:absolute;right:-4px;bottom:16%;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;box-shadow:0 0 0 2px #fff}
.seat.yes .st{background:var(--mint)}
.seat.no .st{background:#9A8A8C}
.seat.unk .st{background:var(--gold);color:var(--ink)}
.seat.chef .nm{background:var(--red);color:#fff}
.seat.me .nm{box-shadow:0 0 0 2px var(--gold)}
.tally{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:.82rem}
.tally span{border-radius:999px;padding:5px 11px;background:var(--bg)}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsvp .btn{min-height:54px}
.rsvp .btn.on-yes{background:var(--mint);color:#fff;box-shadow:0 10px 20px -12px var(--mint)}
.rsvp .btn.on-no{background:#6E5B5E;color:#fff}
.chefline{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:8px 12px 8px 8px}
.chefline .mini{width:44px;flex:none}
.chefline div{min-width:0}
.chefline b{display:block;font:400 1.05rem/1.15 var(--f-display);overflow-wrap:anywhere}
.chefline small{color:var(--muted);font-weight:700}
.quote{margin:0;font:600 1.35rem/1.15 var(--f-hand);color:var(--red-deep);text-align:center}

/* sections, cards */
.section{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.section-title,.page-title{margin:0;font:400 1.4rem/1.15 var(--f-display);text-wrap:balance}
.page-title{font-size:1.65rem}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 1px 0 var(--line),0 16px 30px -26px rgba(58,26,31,.5);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-title{margin:0;font:400 1.1rem var(--f-display)}
.card.empty{align-items:center;text-align:center;padding:30px 22px}
.card.empty p{margin:0;color:var(--muted);max-width:34ch}
.big-emoji{font-size:3rem;line-height:1}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.dishline{display:flex;align-items:center;gap:12px;min-width:0}
.dishline .mini{width:52px;flex:none}
.dishline > div{min-width:0}
.dishline strong{display:block;font:400 1.2rem/1.15 var(--f-display);overflow-wrap:anywhere}

/* vote */
.vote{display:flex;flex-direction:column;gap:14px}
.stars{display:flex;justify-content:space-between;gap:6px;max-width:360px}
.star{flex:1;aspect-ratio:1;max-width:62px;border:none;background:none;padding:2px;cursor:pointer;border-radius:16px}
.star svg{width:100%;height:100%;display:block;overflow:visible}
.star path{fill:var(--rim);stroke:#EACCC3;stroke-width:1.1;stroke-linejoin:round;transition:fill .18s}
.star.on path{fill:var(--gold);stroke:var(--gold-deep)}
.star.pop svg{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.star-word{font:600 1.7rem/1 var(--f-hand);color:var(--red-deep);min-height:1.1em}
.field{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:.92rem;min-width:0}
input[type=text],input[type=time],select,textarea{width:100%;font:600 1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:16px;padding:13px 14px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input::placeholder,textarea::placeholder{color:#B79C9F;font-weight:400}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
textarea{min-height:96px;resize:vertical;display:block}
.lock{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);font-weight:600}
.lock svg{flex:none}
.err{color:var(--red-deep);font-weight:800;font-size:.9rem}
.err:empty{display:none}
.teaser{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-weight:700;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn.block{flex:1 1 180px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{appearance:none;border:none;border-radius:999px;padding:13px 22px;font:800 1rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-decoration:none;transition:transform .1s;text-align:center}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.red{background:var(--red);color:var(--white);box-shadow:0 10px 20px -12px var(--red)}
.btn.soft{background:var(--red-soft);color:var(--red-deep)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 10px 20px -12px var(--gold-deep)}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:none;color:var(--red-deep);font:800 .9rem var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.link.danger{color:var(--white);background:var(--red);text-decoration:none;border-radius:999px;padding:6px 12px}
.btn:focus-visible,.star:focus-visible,.tab:focus-visible,.member:focus-visible,.link:focus-visible,.hrow:focus-visible,.opt:focus-visible,.cat:focus-visible,.me-btn:focus-visible,.seg button:focus-visible,.pcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* results */
.mine{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:16px;padding:8px 14px;font-weight:800;font-size:.9rem}
.mine > span{display:inline-flex;align-items:center;gap:8px}
.results{display:flex;flex-direction:column;gap:16px}
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font:400 3.4rem/1 var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.score.sm{font-size:2.2rem}
.mini-stars{display:inline-flex;gap:2px;vertical-align:middle}
.mini-stars svg{width:17px;height:17px;display:block}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:2.4rem 1fr 1.4rem;align-items:center;gap:8px;font-weight:800;font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;display:block}
.bar .fill{height:100%;background:var(--gold);border-radius:99px;display:block}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:4px 2px}
.note{padding:12px 14px 16px;border-radius:4px 4px 16px 4px;box-shadow:0 10px 16px -14px rgba(58,26,31,.6);transform:rotate(var(--r,0deg));display:flex;flex-direction:column;gap:6px;min-width:0}
.note p{margin:0;font:600 1.35rem/1.12 var(--f-hand);overflow-wrap:anywhere}

/* chef */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line)}
.seg button{border:none;background:none;border-radius:999px;padding:9px 8px;font:800 .9rem/1.2 var(--f-body);color:var(--muted);cursor:pointer}
.seg button small{display:block;font-weight:600;font-size:.76rem}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--white)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding-top:8px}
.member{border:2px solid transparent;background:var(--bg);border-radius:20px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:800 .9rem/1.2 var(--f-body);position:relative;overflow-wrap:anywhere;text-align:center}
.member .mav{width:76px}
.member[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.member[aria-checked="true"]::after{content:"Chef";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--white);font:800 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.suggest{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-size:.9rem;font-weight:600}
.wheel-card{overflow:hidden}
.wheel-box{position:relative;width:100%;max-width:340px;margin:0 auto;overflow:hidden}
.wheel-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 18px rgba(58,26,31,.28))}
.wheel-rot{transform:rotate(0deg)}
.wheel-empty{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;font-weight:800;color:var(--muted);font-size:.9rem;line-height:1.3;width:60%;margin-top:40px}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;font-weight:800;font-size:.86rem;max-width:100%}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip .wav{width:28px;flex:none}
.wchip button{border:none;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:2px 4px}
.wchip.win{background:var(--gold);color:var(--ink)}
.wresult{background:linear-gradient(160deg,#FFE7A8,var(--gold-soft));border-radius:20px;padding:14px 16px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.wresult b{font:400 1.6rem/1.1 var(--f-display)}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1;min-width:0}

/* crown */
.crowncard{background:linear-gradient(165deg,#FFE7A8,var(--gold-soft) 45%,var(--card));border-radius:30px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 1px 0 var(--line),0 20px 36px -28px rgba(233,156,0,.9);position:relative;overflow:hidden}
.crowncard .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 10deg,transparent 10deg 20deg);animation:spinr 30s linear infinite;opacity:.6}
@keyframes spinr{to{transform:rotate(360deg)}}
.crowncard > *{position:relative}
.crowncard .bigav{width:150px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.crowncard h2{margin:0;font:400 1.6rem/1.05 var(--f-display)}
.crowncard p{margin:0;color:var(--muted);font-weight:700}
.podium{display:grid;align-items:end;gap:10px;padding-top:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.step .name{font-weight:800;font-size:.92rem;overflow-wrap:anywhere;line-height:1.2}
.step .val{font:400 1.05rem var(--f-display)}
.step .pav{width:84px}
.pblock{width:100%;border-radius:18px 18px 6px 6px;display:grid;place-items:center;font:400 1.7rem var(--f-display);color:var(--white)}
.p1 .pblock{height:104px;background:linear-gradient(var(--gold),var(--gold-deep))}
.p2 .pblock{height:76px;background:linear-gradient(#CBD0D9,#A6ADBA)}
.p3 .pblock{height:58px;background:linear-gradient(#E6A87C,#C27B4C)}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:1.6rem 46px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.pos{font:400 1.1rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.rname{font-weight:800;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.rname small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.rval{font:400 1.1rem var(--f-display);white-space:nowrap}
.best-dish{font:400 1.6rem/1.08 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.card.best{background:linear-gradient(160deg,var(--gold-soft),var(--card) 70%)}

/* history */
.hist{display:flex;flex-direction:column;gap:12px}
.hitem{background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line),0 14px 26px -24px rgba(58,26,31,.5);overflow:hidden}
.hrow{display:grid;grid-template-columns:52px 44px 1fr auto;gap:10px;align-items:center;padding:10px 14px 10px 10px;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.date{background:var(--red-soft);border-radius:14px;text-align:center;padding:7px 0 5px;color:var(--red-deep)}
.date b{display:block;font:400 1.4rem/1 var(--f-display)}
.date span{font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em}
.hmain{min-width:0;display:flex;flex-direction:column}
.hmain strong{font:400 1.05rem/1.15 var(--f-display);overflow-wrap:anywhere}
.hval{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.hval b{font:400 1.3rem var(--f-display);color:var(--red)}
.hval small{font-weight:800;color:var(--muted);font-size:.78rem}
.hval .gold{color:var(--gold-deep);font-size:1rem}
.hbody{padding:4px 16px 18px}

/* family */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pcard{background:var(--card);border:none;border-radius:24px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 1px 0 var(--line),0 14px 26px -24px rgba(58,26,31,.5);position:relative;text-align:center;font:inherit}
.pcard .pav{width:100%;max-width:120px}
.pcard b{font:400 1.05rem/1.1 var(--f-display);overflow-wrap:anywhere}
.pcard small{font-weight:800;color:var(--muted);font-size:.75rem}
.pcard .you{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 9px;font-weight:800;font-size:.7rem}
.pcard.add{background:repeating-linear-gradient(45deg,var(--bg) 0 10px,#fff 10px 20px);border:2px dashed var(--line);justify-content:center;min-height:180px}
.pcard.add .plus{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:400 2rem/1 var(--f-display);box-shadow:0 10px 20px -12px var(--red)}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}

<script>
(function(){
"use strict";
const AV = window.DCAvatar;
const API = "/api";
const DAYMS = 864e5;
const WORDS = ["", "Da rifare", "Così così", "Buono", "Buonissimo", "Da corona!"];
const NOTE_COLORS = ["#FFF4B8","#DDF4E5","#E2ECFF","#FFE0E6"];
const DAYS = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const DAYS_PL = ["la domenica","il lunedì","il martedì","il mercoledì","il giovedì","il venerdì","il sabato"];
const STAR_D = "M12 2.8l2.75 5.86 6.4.78-4.72 4.4 1.22 6.33L12 17.08l-5.65 3.09 1.22-6.33-4.72-4.4 6.4-.78z";
const VIEWS = ["cena","chef","corona","storico","famiglia"];
const LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v12H5V10h1Zm2 0h8V8a4 4 0 1 0-8 0v2Z" fill="currentColor"/></svg>';

/* ---------- helpers ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const DEV = (function(){ let d = lsGet("dc_device"); if(!d){ d = Math.random().toString(36).slice(2,10) + Date.now().toString(36); lsSet("dc_device", d); } return d; })();
function h(tag, props){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "style") e.style.cssText = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  const kids = Array.prototype.slice.call(arguments, 2).flat(Infinity);
  for(const c of kids){ if(c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
/* avatar SVG strings are generated by our own renderer from integer indices only */
function avEl(av, cls, opts){ return h("div",{class:cls || "", html: AV.render(av, opts || {})}); }
function starSvg(on, size){
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns,"svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("aria-hidden","true");
  if(size){ s.setAttribute("width", size); s.setAttribute("height", size); }
  const p = document.createElementNS(ns,"path"); p.setAttribute("d", STAR_D);
  if(on !== null){ p.style.fill = on ? "var(--gold)" : "var(--rim)"; }
  s.append(p); return s;
}
function miniStars(n){
  const r = Math.round(n), w = h("span",{class:"mini-stars",role:"img","aria-label":fmtAvg(n)+" stelle su 5"});
  for(let i=1;i<=5;i++) w.append(starSvg(i<=r, 17));
  return w;
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const idOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromId = id => { const p = id.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function at(day, time){ const d = typeof day === "string" ? fromId(day) : new Date(day); const p = (time || "20:00").split(":").map(Number); d.setHours(p[0]||0, p[1]||0, 0, 0); return d; }
function fam(){ return Store.data; }
function slots(){
  const now = new Date(), time = fam().time || "20:00", wd = Number.isInteger(fam().day) ? fam().day : 3;
  const t = new Date(now); t.setHours(0,0,0,0);
  const w = addDays(t, -((t.getDay() - wd + 7) % 7));
  let vot, up;
  if(now >= at(w, time)){ vot = w; up = addDays(w, 7); } else { vot = addDays(w, -7); up = w; }
  const today = idOf(t);
  return { vot:idOf(vot), up:idOf(up), upAt:at(up, time), votToday:idOf(vot)===today, upToday:idOf(up)===today, today };
}
const fmtLong = id => fromId(id).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtDM = id => fromId(id).toLocaleDateString("it-IT",{day:"numeric",month:"long"});
const monShort = id => fromId(id).toLocaleDateString("it-IT",{month:"short"}).replace(".","");
function countdown(target){
  const ms = target - new Date(); if(ms <= 0) return "adesso!";
  const t = new Date(); t.setHours(0,0,0,0); const td = new Date(target); td.setHours(0,0,0,0);
  const days = Math.round((td - t) / DAYMS);
  if(days === 0){ const min = Math.round(ms/6e4); if(min < 60) return "tra "+min+" min"; const hh = Math.floor(min/60); return "tra "+hh+(hh===1?" ora":" ore"); }
  if(days === 1) return "domani";
  return "tra "+days+" giorni";
}

/* ---------- data ---------- */
const EMPTY = () => ({ name:"", members:[], day:3, time:"20:00", dinners:{}, votes:[] });
const Store = {
  mode:"none", ready:false, fid:null, data:EMPTY(), subs:[], timer:0,
  emit(){ this.subs.forEach(f => f()); },
  async init(){
    const qs = new URLSearchParams(location.search);
    const f = (qs.get("f") || lsGet("dc_family") || "").toLowerCase();
    if(qs.get("demo") === "1"){ this.startDemo(); return; }
    if(/^[a-z0-9]{10}$/.test(f)){
      try{ await this.open(f); return; }
      catch(e){
        if(e.code === 404){ lsDel("dc_family"); toast("Questo link di famiglia non esiste"); }
        else { this.mode = "offline"; this.fid = f; this.ready = true; this.emit(); return; }
      }
    }
    this.mode = "none"; this.ready = true; this.emit();
  },
  async open(f){
    const s = await this.fetchState(f);
    this.fid = f; this.mode = "live"; lsSet("dc_family", f); this.setState(s); this.ready = true;
    try{ const u = new URL(location.href); if(u.searchParams.get("f") !== f){ u.searchParams.set("f", f); history.replaceState(null, "", u.pathname + u.search + u.hash); } }catch(e){}
    this.emit(); this.poll();
  },
  async fetchState(f){
    let r;
    try{ r = await fetch(API + "?f=" + encodeURIComponent(f), { cache:"no-store" }); }
    catch(e){ const x = new Error("niente connessione"); x.code = 0; throw x; }
    let body = null; try{ body = await r.json(); }catch(e){}
    if(!r.ok || !body){ const x = new Error((body && body.error) || ("errore del server " + r.status)); x.code = r.status; throw x; }
    return body;
  },
  setState(s){
    const votes = s.votes || {};
    this.data = { name:s.name || "", members:(s.members || []).map(m => ({ id:m.id, name:m.name, av:AV.clean(m.av) })), day:Number.isInteger(s.day) ? s.day : 3, time:s.time || "20:00", dinners:s.dinners || {}, votes:Object.keys(votes).map(k => Object.assign({ id:k }, votes[k])) };
  },
  poll(){
    clearInterval(this.timer);
    const tick = async () => {
      if(document.hidden || this.mode !== "live" || ui.editor) return;
      try{ const s = await this.fetchState(this.fid), before = JSON.stringify(this.data); this.setState(s); if(JSON.stringify(this.data) !== before) this.emit(); }catch(e){}
    };
    this.timer = setInterval(tick, 20000);
    if(!this._vis){ this._vis = true; document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); }); }
  },
  async post(op){
    let r;
    try{ r = await fetch(API, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(op) }); }
    catch(e){ throw new Error("niente connessione"); }
    let body = null; try{ body = await r.json(); }catch(e){}
    if(!r.ok || !body || body.error) throw new Error((body && body.error) || ("errore del server " + r.status));
    return body;
  },
  async send(op){
    if(this.mode !== "live"){ this.local(op); return; }
    const body = await this.post(Object.assign({ f:this.fid }, op));
    this.setState(body); this.emit();
  },
  local(op){
    const d = this.data;
    if(op.op === "settings"){ if(op.day != null) d.day = op.day; if(op.time) d.time = op.time; if(op.name) d.name = op.name; }
    if(op.op === "member"){ const i = d.members.findIndex(m => m.id === op.member.id); if(i >= 0) d.members[i] = op.member; else d.members.push(op.member); }
    if(op.op === "removeMember") d.members = d.members.filter(m => m.id !== op.id);
    if(op.op === "dinner"){ const prev = d.dinners[op.date] || {}; d.dinners[op.date] = { chefId:op.chefId, chefName:op.chefName, dish:op.dish, note:op.note, rsvp:prev.rsvp || {}, wheel:prev.wheel || [], spin:(prev.spin && prev.dish === op.dish) ? prev.spin : null }; }
    if(op.op === "chefOnly"){ const x = d.dinners[op.date] || (d.dinners[op.date] = { rsvp:{}, wheel:[] }); x.chefId = op.chefId; x.chefName = op.chefName; x.note = op.note; }
    if(op.op === "wheelAdd"){
      const x = d.dinners[op.date] || (d.dinners[op.date] = { rsvp:{}, wheel:[] }); x.wheel = x.wheel || [];
      const dish = String(op.dish || "").trim().slice(0,40);
      if(!dish) throw new Error("scrivi un piatto");
      if(x.spin) throw new Error("la ruota ha già girato");
      if(x.wheel.length >= 12) throw new Error("la ruota è piena (12 piatti)");
      if(x.wheel.filter(w => w.by === op.mid).length >= 2) throw new Error("puoi proporre al massimo 2 piatti");
      if(x.wheel.some(w => w.dish.toLowerCase() === dish.toLowerCase())) throw new Error("questo piatto è già sulla ruota");
      x.wheel.push({ id:"w" + Math.random().toString(36).slice(2,9), dish, by:op.mid });
    }
    if(op.op === "wheelRemove"){ const x = d.dinners[op.date]; if(x && x.wheel && !x.spin) x.wheel = x.wheel.filter(w => w.id !== op.id); }
    if(op.op === "spin"){
      const x = d.dinners[op.date];
      if(!x || !x.wheel || x.wheel.length < 2) throw new Error("servono almeno 2 piatti sulla ruota");
      if(x.spin) throw new Error("la ruota ha già girato");
      const i = Math.floor(Math.random() * x.wheel.length);
      x.spin = { id:x.wheel[i].id, at:new Date().toISOString(), jitter:Math.random() - .5, by:op.mid }; x.dish = x.wheel[i].dish;
    }
    if(op.op === "wheelReset"){ const x = d.dinners[op.date]; if(x){ const w = (x.wheel || []).find(e => x.spin && e.id === x.spin.id); if(w && x.dish === w.dish) x.dish = ""; x.spin = null; } }
    if(op.op === "rsvp"){ const x = d.dinners[op.date] || (d.dinners[op.date] = { rsvp:{} }); x.rsvp = x.rsvp || {}; if(op.v === 1 || op.v === 0) x.rsvp[op.mid] = op.v; else delete x.rsvp[op.mid]; }
    if(op.op === "vote"){ const id = op.dinner + "_" + op.device, row = { id, dinner:op.dinner, stars:op.stars, comment:op.comment }, i = d.votes.findIndex(v => v.id === id); if(i >= 0) d.votes[i] = row; else d.votes.push(row); }
    this.persist(); this.emit();
  },
  async create(name, code){ const body = await this.post({ op:"create", name, code }); await this.open(body.id); },
  leave(){ lsDel("dc_family"); clearInterval(this.timer); this.fid = null; this.mode = "none"; this.data = EMPTY(); try{ history.replaceState(null, "", location.pathname); }catch(e){} this.emit(); },
  startDemo(){
    this.mode = "demo";
    let d = null; try{ d = JSON.parse(lsGet("dc_demo_it") || "null"); }catch(e){}
    this.data = d && d.dinners && d.members ? d : seedDemo();
    if(!lsGet("dc_me_demo")) lsSet("dc_me_demo", "m3");
    this.ready = true; this.persist(); this.emit();

async function saveEditor(){
  const e = ui.editor, name = e.name.trim();
  if(!name){ e.err = "Dai un nome al personaggio."; renderEditor(); const n = document.getElementById("ed-name"); if(n) n.focus(); return; }
  if(members().some(m => m.id !== e.id && m.name.toLowerCase() === name.toLowerCase())){ e.err = "C'è già un personaggio con questo nome."; renderEditor(); return; }
  const id = e.id || ("m" + Date.now().toString(36) + Math.random().toString(36).slice(2,5));
  try{
    await Store.send({ op:"member", member:{ id, name, av:AV.clean(e.av) } });
    if(e.me) setMe(id);
    const first = e.first; ui.editor = null; renderEditor();
    confetti(); toast(first ? "Benvenuto a tavola, " + name + "!" : "Personaggio salvato");
    if(first) go("cena"); else render();
  }catch(err){ e.err = "Non salvato: " + err.message + "."; renderEditor(); }
}
function renderEditor(){

  const name = h("input",{id:"ed-name",type:"text",maxlength:"20",autocomplete:"off",placeholder:"Come ti chiami? (es. Nonna Rita)",oninput:ev => { e.name = ev.target.value; }}); name.value = e.name;

    h("div",{class:"ed-inner"},
      h("div",{class:"ed-top"},
        e.first && !members().length ? h("span",{style:"width:90px"}) : h("button",{class:"btn ghost",type:"button",onclick:closeEditor},"Annulla"),
        h("h2",{id:"ed-title"}, isNew ? (e.me ? "Crea il tuo personaggio" : "Nuovo personaggio") : "Modifica " + e.name),
        h("button",{class:"btn red",type:"button",onclick:saveEditor},"Salva")),
      h("div",{class:"ed-stage"}, big, h("button",{class:"dice",type:"button","aria-label":"Personaggio a caso",onclick:() => { e.av = AV.clean(AV.random()); e.wig = true; renderEditor(); }}, "🎲", h("span",null,"A caso"))),
      h("div",{class:"ed-name"}, name, e.err ? h("div",{class:"err",role:"alert",style:"margin-top:6px"}, e.err) : null),

      h("div",{class:"cats",role:"tablist"}, CATS.map(c => h("button",{class:"cat",type:"button",role:"tab","aria-pressed":String(e.cat===c.k),"aria-selected":String(e.cat===c.k),onclick:() => { e.cat = c.k; renderEditor(); }}, h("i",null,c.icon), c.label))),

/* ---------- feedback ---------- */
let toastT = 0;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); if(!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth*dpr, H = cv.height = innerHeight*dpr;
  cv.hidden = false;
  const cols = ["#E5412F","#FFB21E","#2E9D5B","#5B8DEF","#FF8FA8"];
  const ps = Array.from({length:120}, () => ({ x:W/2, y:H*.6, vx:(Math.random()-.5)*W*.03, vy:-(Math.random()*H*.018 + H*.01), r:(Math.random()*6+5)*dpr, c:cols[Math.random()*5|0], a:Math.random()*6, va:(Math.random()-.5)*.35 }));

  (function frame(t){ ctx.clearRect(0,0,W,H); ps.forEach(p => { p.vy += g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(t - t0 < 2400) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; } })(t0);
}

/* ---------- render ---------- */
const VIEW_FN = { cena:viewCena, chef:viewChef, corona:viewCorona, storico:viewStorico, famiglia:viewFamiglia };
function saveFocus(){ const a = document.activeElement; return a && a.id && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null; }

function render(){
  if(ui.spinning) return;
  const f = saveFocus();
  const inFamily = Store.ready && (Store.mode === "live" || Store.mode === "demo");
  const needWho = inFamily && !meId();
  const showTabs = inFamily && !needWho;
  document.getElementById("app").classList.toggle("bare", !showTabs);
  document.getElementById("tabbar").hidden = !showTabs;
  const meBtn = document.getElementById("me-btn"), me = member(meId());

  VIEWS.forEach(v => { const b = document.querySelector('[data-tab="'+v+'"]'); if(showTabs && ui.tab === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });

  box.hidden = false;
  restoreFocus(f);
  setTimeout(checkRemoteSpin, 300);
}

document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
document.addEventListener("keydown", e => { if(e.key === "Escape" && ui.editor && !(ui.editor.first && !members().length)) closeEditor(); });
setInterval(() => { const a = document.activeElement; if(!document.hidden && !ui.editor && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"))) render(); }, 60000);
Store.subs.push(() => { render(); });
render();
Store.init();
})();
